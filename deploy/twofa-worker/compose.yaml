services:
  twofa-worker:
    build: .
    restart: unless-stopped
    init: true
    environment:
      TWOFA_WORKER_TOKEN: ${TWOFA_WORKER_TOKEN:?set a random worker access token}
      TWOFA_DATA_KEY: ${TWOFA_DATA_KEY:?set a persistent Fernet encryption key}
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - twofa-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    stop_grace_period: 30s
volumes:
  twofa-data:
